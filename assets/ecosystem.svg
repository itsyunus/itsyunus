<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" fill="none" role="img" aria-labelledby="title desc"><title id="title">Data and ML system map</title><desc id="desc">Animated map of data sources, foundations, analytics, product outcomes, operations, research, and engineering.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell,.ping{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#ffffff;--ink:#111111;--muted:#707070;--dim:#999999;--rule:#dddddd;--accent:#666666;--panel:#fafafa;--soft:#f3f3f3}</style><rect class="paper" width="1000" height="640"/><path d="M182 333H822M500 166V333M182 333V460M500 333V460M822 333V460" class="draw" stroke="var(--rule)"/><path d="M182 333H822M500 166V333M182 333V460M500 333V460M822 333V460" class="march" stroke="var(--accent)" opacity=".55"/><g class="rise" style="animation-delay:0.12s"><rect x="370.0" y="55.0" width="260" height="110" rx="3" class="panel"/><circle cx="393.0" cy="80.0" r="4" fill="var(--accent)" class="pulse"/><text x="408.0" y="85.0" class="small muted">SIGNALS</text><text x="390.0" y="124.0" font-size="14">GPU telemetry · 500K+ records</text></g><g class="rise" style="animation-delay:0.22s"><rect x="52.0" y="214.0" width="260" height="112" rx="3" class="panel"/><circle cx="75.0" cy="239.0" r="4" fill="var(--accent)" class="pulse"/><text x="90.0" y="244.0" class="small muted">DATA FOUNDATION</text><text x="72.0" y="283.0" font-size="14">Python · SQL · ETL quality</text></g><g class="rise" style="animation-delay:0.32s"><rect x="370.0" y="214.0" width="260" height="112" rx="3" class="panel"/><circle cx="393.0" cy="239.0" r="4" fill="var(--accent)" class="pulse"/><text x="408.0" y="244.0" class="small muted">ANALYTICS</text><text x="390.0" y="283.0" font-size="14">KPIs · dashboards · root cause</text></g><g class="rise" style="animation-delay:0.42000000000000004s"><rect x="688.0" y="214.0" width="260" height="112" rx="3" class="panel"/><circle cx="711.0" cy="239.0" r="4" fill="var(--accent)" class="pulse"/><text x="726.0" y="244.0" class="small muted">PRODUCTS</text><text x="708.0" y="283.0" font-size="14">Allocation · faster reporting</text></g><g class="rise" style="animation-delay:0.52s"><rect x="52.0" y="444.0" width="260" height="112" rx="3" class="panel"/><circle cx="75.0" cy="469.0" r="4" fill="var(--accent)" class="pulse"/><text x="90.0" y="474.0" class="small muted">OPERATIONS</text><text x="72.0" y="513.0" font-size="14">250K+ records · Cautio</text></g><g class="rise" style="animation-delay:0.62s"><rect x="370.0" y="444.0" width="260" height="112" rx="3" class="panel"/><circle cx="393.0" cy="469.0" r="4" fill="var(--accent)" class="pulse"/><text x="408.0" y="474.0" class="small muted">RESEARCH</text><text x="390.0" y="513.0" font-size="14">Character-aware NLP · PyTorch</text></g><g class="rise" style="animation-delay:0.7200000000000001s"><rect x="688.0" y="444.0" width="260" height="112" rx="3" class="panel"/><circle cx="711.0" cy="469.0" r="4" fill="var(--accent)" class="pulse"/><text x="726.0" y="474.0" class="small muted">ENGINEERING</text><text x="708.0" y="513.0" font-size="14">React · Rails · API systems</text></g><circle cx="500" cy="333" r="23" stroke="var(--accent)" class="pulse"/><circle cx="500" cy="333" r="4" fill="var(--accent)"/></svg>