<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" fill="none" role="img" aria-labelledby="title desc"><title id="title">Professional experience</title><desc id="desc">Four roles with employers, dates, scope, and outcomes.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#ffffff;--ink:#111111;--muted:#707070;--dim:#999999;--rule:#dddddd;--accent:#666666;--panel:#fafafa;--soft:#f3f3f3}</style><rect class="paper" width="1000" height="370"/><g class="rise" style="animation-delay:0.12s"><path d="M40 92H960" class="rule"/><text x="46" y="41" class="small dim">01</text><text x="96" y="40" class="small muted">OCT 2026 — PRESENT</text><text x="330" y="42" font-size="15" font-weight="700">DATA SPECIALIST</text><text x="330" y="65" class="small accent">NVIDIA · Bengaluru</text><text x="600" y="53" font-size="12" class="muted">500K+ GPU telemetry records · 10+ KPI dashboards · 99.4% data accuracy</text></g><g class="rise" style="animation-delay:0.28s"><path d="M40 178H960" class="rule"/><text x="46" y="127" class="small dim">02</text><text x="96" y="126" class="small muted">JUN 2026 — PRESENT</text><text x="330" y="128" font-size="15" font-weight="700">DATA ANALYST</text><text x="330" y="151" class="small accent">CAUTIO · Bengaluru</text><text x="600" y="139" font-size="12" class="muted">250K+ operational records · 45% less manual reporting · 10+ hours saved weekly</text></g><g class="rise" style="animation-delay:0.44s"><path d="M40 264H960" class="rule"/><text x="46" y="213" class="small dim">03</text><text x="96" y="212" class="small muted">MAR — MAY 2026</text><text x="330" y="214" font-size="15" font-weight="700">BUSINESS ANALYST INTERN</text><text x="330" y="237" class="small accent">LAUNCHED GLOBAL · Bengaluru</text><text x="600" y="225" font-size="12" class="muted">React/Redux + Rails policy features · 20+ business requirements</text></g><g class="rise" style="animation-delay:0.6s"><path d="M40 350H960" class="rule"/><text x="46" y="299" class="small dim">04</text><text x="96" y="298" class="small muted">JUN — AUG 2024</text><text x="330" y="300" font-size="15" font-weight="700">SOFTWARE ENGINEERING INTERN</text><text x="330" y="323" class="small accent">BOARD INFINITY · Remote</text><text x="600" y="311" font-size="12" class="muted">C++ · algorithms · object-oriented programming · Git code reviews</text></g></svg>