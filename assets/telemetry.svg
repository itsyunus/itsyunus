<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" fill="none" role="img" aria-labelledby="title desc"><title id="title">Animated data telemetry</title><desc id="desc">Animated operational metrics and a live scanning line, based on experience metrics in Yunus’s CV.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell,.ping{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#ffffff;--ink:#111111;--muted:#707070;--dim:#999999;--rule:#dddddd;--accent:#666666;--panel:#fafafa;--soft:#f3f3f3}</style><rect class="paper" width="1000" height="320"/><path d="M34 284H966" class="draw" stroke="var(--rule)"/><g class="rise" style="animation-delay:0.1s"><text x="44" y="77" font-size="29" font-weight="700">500K+</text><text x="44" y="103" class="small muted">GPU RECORDS ANALYZED</text><rect x="44" y="139" width="190" height="5" fill="var(--soft)"/><rect x="44" y="139" width="166" height="5" fill="var(--accent)" class="grow" style="animation-delay:0.4s"/><text x="44" y="194" class="small dim">NVIDIA / DATA OPERATIONS</text></g><g class="rise" style="animation-delay:0.24000000000000002s"><text x="282" y="77" font-size="29" font-weight="700">+40%</text><text x="282" y="103" class="small muted">RESOURCE ALLOCATION EFFICIENCY</text><rect x="282" y="139" width="190" height="5" fill="var(--soft)"/><rect x="282" y="139" width="142" height="5" fill="var(--accent)" class="grow" style="animation-delay:0.56s"/><text x="282" y="194" class="small dim">NVIDIA / DATA OPERATIONS</text></g><g class="rise" style="animation-delay:0.38s"><text x="520" y="77" font-size="29" font-weight="700">99.4%</text><text x="520" y="103" class="small muted">VALIDATED DATA ACCURACY</text><rect x="520" y="139" width="190" height="5" fill="var(--soft)"/><rect x="520" y="139" width="179" height="5" fill="var(--accent)" class="grow" style="animation-delay:0.72s"/><text x="520" y="194" class="small dim">NVIDIA / DATA OPERATIONS</text></g><g class="rise" style="animation-delay:0.52s"><text x="758" y="77" font-size="29" font-weight="700">12 HRS</text><text x="758" y="103" class="small muted">SAVED EACH WEEK</text><rect x="758" y="139" width="190" height="5" fill="var(--soft)"/><rect x="758" y="139" width="128" height="5" fill="var(--accent)" class="grow" style="animation-delay:0.88s"/><text x="758" y="194" class="small dim">NVIDIA / DATA OPERATIONS</text></g><path d="M47 238 C130 218 170 252 240 223 S360 249 435 216 S550 241 630 207 S760 233 850 198 S920 218 957 187" stroke="var(--accent)" stroke-width="2" class="draw"/><circle r="5" fill="var(--accent)" class="pulse"><animateMotion dur="7s" repeatCount="indefinite" path="M47 238 C130 218 170 252 240 223 S360 249 435 216 S550 241 630 207 S760 233 850 198 S920 218 957 187"/></circle></svg>