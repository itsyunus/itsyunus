<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 238" width="1000" height="238" fill="none" role="img" aria-labelledby="title desc"><title id="title">Technical stack</title><desc id="desc">Tools grouped into analytics, machine learning, and software engineering.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#ffffff;--ink:#111111;--muted:#707070;--dim:#999999;--rule:#dddddd;--accent:#666666;--panel:#fafafa;--soft:#f3f3f3}</style><rect class="paper" width="1000" height="238"/><text x="42" y="35" class="small muted">DATA / ANALYTICS</text><g class="rise" style="animation-delay:0.08s"><rect x="300" y="15" width="71" height="30" rx="2" class="panel"/><text x="312" y="35" font-size="12">Python</text></g><g class="rise" style="animation-delay:0.115s"><rect x="381" y="15" width="47" height="30" rx="2" class="panel"/><text x="393" y="35" font-size="12">SQL</text></g><g class="rise" style="animation-delay:0.15000000000000002s"><rect x="438" y="15" width="63" height="30" rx="2" class="panel"/><text x="450" y="35" font-size="12">MySQL</text></g><g class="rise" style="animation-delay:0.185s"><rect x="511" y="15" width="87" height="30" rx="2" class="panel"/><text x="523" y="35" font-size="12">Power BI</text></g><g class="rise" style="animation-delay:0.22000000000000003s"><rect x="608" y="15" width="79" height="30" rx="2" class="panel"/><text x="620" y="35" font-size="12">Tableau</text></g><g class="rise" style="animation-delay:0.255s"><rect x="697" y="15" width="63" height="30" rx="2" class="panel"/><text x="709" y="35" font-size="12">Excel</text></g><g class="rise" style="animation-delay:0.29000000000000004s"><rect x="770" y="15" width="71" height="30" rx="2" class="panel"/><text x="782" y="35" font-size="12">Pandas</text></g><text x="42" y="103" class="small muted">ML / RESEARCH</text><g class="rise" style="animation-delay:0.255s"><rect x="300" y="83" width="79" height="30" rx="2" class="panel"/><text x="312" y="103" font-size="12">PyTorch</text></g><g class="rise" style="animation-delay:0.29000000000000004s"><rect x="389" y="83" width="47" height="30" rx="2" class="panel"/><text x="401" y="103" font-size="12">NLP</text></g><g class="rise" style="animation-delay:0.325s"><rect x="446" y="83" width="119" height="30" rx="2" class="panel"/><text x="458" y="103" font-size="12">Transformers</text></g><g class="rise" style="animation-delay:0.36000000000000004s"><rect x="575" y="83" width="63" height="30" rx="2" class="panel"/><text x="587" y="103" font-size="12">NumPy</text></g><g class="rise" style="animation-delay:0.3950000000000001s"><rect x="648" y="83" width="119" height="30" rx="2" class="panel"/><text x="660" y="103" font-size="12">scikit-learn</text></g><text x="42" y="171" class="small muted">ENGINEERING / CLOUD</text><g class="rise" style="animation-delay:0.7100000000000001s"><rect x="300" y="151" width="47" height="30" rx="2" class="panel"/><text x="312" y="171" font-size="12">C++</text></g><g class="rise" style="animation-delay:0.745s"><rect x="357" y="151" width="63" height="30" rx="2" class="panel"/><text x="369" y="171" font-size="12">React</text></g><g class="rise" style="animation-delay:0.78s"><rect x="430" y="151" width="63" height="30" rx="2" class="panel"/><text x="442" y="171" font-size="12">Redux</text></g><g class="rise" style="animation-delay:0.8150000000000001s"><rect x="503" y="151" width="63" height="30" rx="2" class="panel"/><text x="515" y="171" font-size="12">Rails</text></g><g class="rise" style="animation-delay:0.85s"><rect x="576" y="151" width="63" height="30" rx="2" class="panel"/><text x="588" y="171" font-size="12">Flask</text></g><g class="rise" style="animation-delay:0.885s"><rect x="649" y="151" width="39" height="30" rx="2" class="panel"/><text x="661" y="171" font-size="12">Go</text></g><g class="rise" style="animation-delay:0.92s"><rect x="698" y="151" width="47" height="30" rx="2" class="panel"/><text x="710" y="171" font-size="12">AWS</text></g><g class="rise" style="animation-delay:0.9550000000000001s"><rect x="755" y="151" width="71" height="30" rx="2" class="panel"/><text x="767" y="171" font-size="12">Docker</text></g><g class="rise" style="animation-delay:0.9900000000000001s"><rect x="836" y="151" width="47" height="30" rx="2" class="panel"/><text x="848" y="171" font-size="12">Git</text></g></svg>