<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none" role="img" aria-labelledby="title desc"><title id="title">Selected projects</title><desc id="desc">Projects, product work, and research spanning language modeling, trading systems, and serverless architecture.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell,.ping{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#ffffff;--ink:#111111;--muted:#707070;--dim:#999999;--rule:#dddddd;--accent:#666666;--panel:#fafafa;--soft:#f3f3f3}</style><rect class="paper" width="1000" height="1000"/><g class="rise" style="animation-delay:0.12s"><rect x="24" y="22" width="952" height="170" rx="3" class="panel"/><text x="50" y="60" class="small muted">WORK / 01</text><text x="50" y="96" font-size="19" font-weight="700">CHARACTER-AWARE LANGUAGE MODEL</text><text x="50" y="126" class="small accent">PyTorch · NLP · UD English Web Treebank</text><path d="M50 142H950" class="rule"/><text x="50" y="169" font-size="14" class="muted">Improved perplexity on unseen words by 3% vs. a same-size baseline.</text><circle cx="946" cy="57" r="4" fill="var(--accent)" class="pulse"/></g><g class="rise" style="animation-delay:0.3s"><rect x="24" y="216" width="952" height="170" rx="3" class="panel"/><text x="50" y="254" class="small muted">WORK / 02</text><text x="50" y="290" font-size="19" font-weight="700">TRANSFORMER + SENTIMENT FOR TRADING</text><text x="50" y="320" class="small accent">Sequence models · Flask · Go · React · AWS</text><path d="M50 336H950" class="rule"/><text x="50" y="363" font-size="14" class="muted">Market and news signals, REST prediction API, and R back-testing.</text><circle cx="946" cy="251" r="4" fill="var(--accent)" class="pulse"/></g><g class="rise" style="animation-delay:0.48s"><rect x="24" y="410" width="952" height="170" rx="3" class="panel"/><text x="50" y="448" class="small muted">WORK / 03</text><text x="50" y="484" font-size="19" font-weight="700">MERAKI POLICY MANAGEMENT</text><text x="50" y="514" class="small accent">React · Redux · Ruby on Rails</text><path d="M50 530H950" class="rule"/><text x="50" y="557" font-size="14" class="muted">Dashboard features developed with product and engineering; 20+ requirements.</text><circle cx="946" cy="445" r="4" fill="var(--accent)" class="pulse"/></g><g class="rise" style="animation-delay:0.66s"><rect x="24" y="604" width="952" height="170" rx="3" class="panel"/><text x="50" y="642" class="small muted">WORK / 04</text><text x="50" y="678" font-size="19" font-weight="700">SCALABLE SERVERLESS FRAMEWORK</text><text x="50" y="708" class="small accent">Event-driven systems · performance · cost analysis</text><path d="M50 724H950" class="rule"/><text x="50" y="751" font-size="14" class="muted">Research accepted for publication in IJSREM, 2026.</text><circle cx="946" cy="639" r="4" fill="var(--accent)" class="pulse"/></g><g class="rise" style="animation-delay:0.84s"><rect x="24" y="798" width="952" height="170" rx="3" class="panel"/><text x="50" y="836" class="small muted">WORK / 05</text><text x="50" y="872" font-size="19" font-weight="700">THE COMPUTE HORIZON</text><text x="50" y="902" class="small accent">Inference-time scaling · reasoning AI</text><path d="M50 918H950" class="rule"/><text x="50" y="945" font-size="14" class="muted">Research manuscript submitted to JCTSA, 2026.</text><circle cx="946" cy="833" r="4" fill="var(--accent)" class="pulse"/></g></svg>