<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" width="1000" height="245" fill="none" role="img" aria-labelledby="title desc"><title id="title">About Yunus</title><desc id="desc">Data specialist focused on telemetry, analytics, and applied machine learning.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.3);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell,.ping{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#0d1117;--ink:#e6edf3;--muted:#9a9a9a;--dim:#707070;--rule:#353535;--accent:#b6b6b6;--panel:#111111;--soft:#171717}</style><rect class="paper" width="1000" height="245"/><rect x="24" y="20" width="952" height="205" rx="4" class="panel"/><text x="48" y="57" class="small muted">PROFILE / 2026</text><text x="48" y="91" font-size="22" font-weight="700">I turn complex operational data into trusted decisions.</text><path d="M48 112H952" class="rule"/><g class="rise" style="animation-delay:0.15s"><text x="48" y="143" class="small muted">ROLE</text><text x="48" y="172" font-size="18" font-weight="700">Data Specialist</text><text x="48" y="198" class="small muted">NVIDIA · Bengaluru</text></g><path d="M318 128v78" class="rule"/><g class="rise" style="animation-delay:0.27s"><text x="350" y="143" class="small muted">FOCUS</text><text x="350" y="172" font-size="18" font-weight="700">Data systems</text><text x="350" y="198" class="small muted">Telemetry · ETL · analytics</text></g><path d="M620 128v78" class="rule"/><g class="rise" style="animation-delay:0.39s"><text x="652" y="143" class="small muted">INTERESTS</text><text x="652" y="172" font-size="18" font-weight="700">Applied ML</text><text x="652" y="198" class="small muted">NLP · models · products</text></g><text x="48" y="220" class="small dim">MICROSOFT AI-900  /  ORACLE CERTIFIED CLOUD ENGINEER</text></svg>