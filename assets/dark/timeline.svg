<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" fill="none" role="img" aria-labelledby="title desc"><title id="title">Development timeline</title><desc id="desc">Animated timeline from neural language modeling and software engineering to product analytics and NVIDIA GPU data work.</desc><style>
*{box-sizing:border-box}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;fill:var(--ink)}
.small{font-size:12px;letter-spacing:1.5px}.body{font-size:16px}.muted{fill:var(--muted)}.dim{fill:var(--dim)}.accent{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:1}.paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--rule);stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes march{to{stroke-dashoffset:-24}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;transform-box:fill-box;transform-origin:center}
.fade{opacity:0;animation:fade .7s ease forwards}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}.march{stroke-dasharray:3 9;animation:march 1.5s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@media(prefers-reduced-motion:reduce){.rise,.fade,.draw,.pulse,.march,.spin,.grow,.cell{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
:root{--paper:#0d1117;--ink:#e6edf3;--muted:#9a9a9a;--dim:#707070;--rule:#353535;--accent:#b6b6b6;--panel:#111111;--soft:#171717}</style><rect class="paper" width="1200" height="250"/><path d="M58 126H1142" stroke="var(--rule)" class="axis draw"/><path d="M58 126H1142" stroke="var(--accent)" stroke-width="1" class="march"/><g class="rise" style="animation-delay:0.16s"><circle cx="88" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="88" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M88 126V96" class="rule"/><text x="100" y="78" text-anchor="start" class="small accent">2023</text><text x="100" y="98" text-anchor="start" font-size="13" font-weight="700">LANGUAGE MODEL</text><text x="100" y="118" text-anchor="start" font-size="11" class="muted">Character-aware NLP research</text></g><g class="rise" style="animation-delay:0.32s"><circle cx="286" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="286" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M286 126V161" class="rule"/><text x="298" y="186" text-anchor="start" class="small accent">2024</text><text x="298" y="206" text-anchor="start" font-size="13" font-weight="700">BOARD INFINITY</text><text x="298" y="226" text-anchor="start" font-size="11" class="muted">Software engineering internship</text></g><g class="rise" style="animation-delay:0.48s"><circle cx="485" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="485" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M485 126V96" class="rule"/><text x="497" y="78" text-anchor="start" class="small accent">MAR 2026</text><text x="497" y="98" text-anchor="start" font-size="13" font-weight="700">LAUNCHED GLOBAL</text><text x="497" y="118" text-anchor="start" font-size="11" class="muted">Product engineering / Meraki</text></g><g class="rise" style="animation-delay:0.64s"><circle cx="684" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="684" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M684 126V161" class="rule"/><text x="696" y="186" text-anchor="start" class="small accent">JUN 2026</text><text x="696" y="206" text-anchor="start" font-size="13" font-weight="700">CAUTIO</text><text x="696" y="226" text-anchor="start" font-size="11" class="muted">Operations analytics</text></g><g class="rise" style="animation-delay:0.8s"><circle cx="883" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="883" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M883 126V96" class="rule"/><text x="895" y="78" text-anchor="start" class="small accent">AUG 2026</text><text x="895" y="98" text-anchor="start" font-size="13" font-weight="700">B.TECH (HONS.)</text><text x="895" y="118" text-anchor="start" font-size="11" class="muted">Computer Science · LPU</text></g><g class="rise" style="animation-delay:0.9600000000000001s"><circle cx="1082" cy="126" r="7" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/><circle cx="1082" cy="126" r="13" stroke="var(--accent)" class="pulse" opacity=".6"/><path d="M1082 126V161" class="rule"/><text x="1070" y="186" text-anchor="end" class="small accent">OCT 2026</text><text x="1070" y="206" text-anchor="end" font-size="13" font-weight="700">NVIDIA</text><text x="1070" y="226" text-anchor="end" font-size="11" class="muted">GPU data specialist</text></g><circle cx="1138" cy="126" r="4" fill="var(--accent)" class="pulse"/></svg>